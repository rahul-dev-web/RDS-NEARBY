name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docs:
    name: Product baseline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen product baseline
        shell: bash
        run: |
          set -euo pipefail
          for file in PRODUCT_SPEC.md PRODUCT_RULES.md ERD.md REFERRAL_RULES.md CREDIT_RULES.md NOTIFICATION_SPEC.md; do
            test -f "docs/$file"
          done
          grep -q "Marketing Credits" docs/PRODUCT_SPEC.md
          grep -q "Local Points" docs/PRODUCT_SPEC.md
          grep -q "Organic Listing" docs/PRODUCT_SPEC.md
          grep -q "Boost Shop" docs/PRODUCT_SPEC.md
          grep -q "Promote Offer" docs/PRODUCT_SPEC.md
          grep -q "Accepting Requests" docs/PRODUCT_SPEC.md
